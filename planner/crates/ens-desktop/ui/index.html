<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unshrouded</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="top"></header>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <div class="body">
    <aside class="rail" id="rail" aria-label="Headline numbers"></aside>

<div id="dlg" class="dlg-back" hidden></div>
