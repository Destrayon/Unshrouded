[package]
name = "ens-inject"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Loads ens_hook.dll into a running enshrouded.exe, or checks an exe for the hook signature"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ens-inject"
path = "src/main.rs"

[dependencies]
ens-hook = { path = "../ens-hook" }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_Security"] }
